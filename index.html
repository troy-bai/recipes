<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美味食譜知識庫</title>
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- 引入 Marked.js (Markdown 渲染) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 引入 MiniSearch (全文模糊檢索) -->
  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/minisearch.min.js"></script>
  <!-- 載入本機食譜資料庫 -->
  <script src="database.js"></script>

  <style>
    /* 全域變數與現代暗黑精緻色調 */
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(22, 30, 49, 0.7);
      --bg-card-hover: rgba(30, 41, 69, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(245, 158, 11, 0.3);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #f59e0b; /* 溫馨琥珀火光橘 */
      --accent-glow: rgba(245, 158, 11, 0.15);
      --accent-secondary: #10b981; /* 翠綠青蔥色 */
      --accent-secondary-glow: rgba(16, 119, 129, 0.15);
      --font-title: 'Outfit', 'Noto Sans TC', sans-serif;
      --font-body: 'Inter', 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導航列 */
    header {
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--accent), #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.4));
    }

    h1 {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #ffffff, #e5e7eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .db-stats {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .badge {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* 主要內容區佈局 */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* 左側邊欄：知識分類樹 */
    .sidebar {
      width: 280px;
      border-right: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.4);
      padding: 1.5rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-family: var(--font-title);
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .category-group {
      margin-bottom: 1.75rem;
    }

    .category-header {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .category-header::after {
      content: '▾';
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .category-group.collapsed .category-header::after {
      transform: rotate(-90deg);
    }

    .category-list {
      list-style: none;
      padding-left: 0.5rem;
      transition: max-height 0.3s ease-out;
      overflow: hidden;
    }

    .category-group.collapsed .category-list {
      max-height: 0 !important;
    }

    .category-item {
      padding: 0.4rem 0.75rem;
      font-size: 0.88rem;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-item:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }

    .category-item.active {
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: 500;
      border: 1px solid rgba(245, 158, 11, 0.15);
    }

    .item-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }

    /* 中間欄：列表與搜尋 */
    .list-panel {
      width: 420px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.2);
      flex-shrink: 0;
    }

    .search-container {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.92rem;
      transition: all 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      background: rgba(30, 41, 59, 0.8);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .search-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .recipe-list {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* 食譜卡片 */
    .recipe-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .recipe-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--accent), #ef4444);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .recipe-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 1px var(--accent-glow) inset;
    }

    .recipe-card:hover::before {
      opacity: 1;
    }

    .recipe-card.active {
      background: rgba(30, 41, 69, 0.6);
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.08);
    }

    .recipe-card.active::before {
      opacity: 1;
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .card-author {
      font-weight: 500;
      color: var(--text-primary);
    }

    .card-summary {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 0.85rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .recipe-card:hover .tag-pill {
      background: rgba(255, 255, 255, 0.06);
    }

    /* 右側欄：食譜詳細展示區 */
    .detail-panel {
      flex: 1;
      overflow-y: auto;
      background: rgba(11, 15, 25, 0.3);
      padding: 2.5rem 3.5rem;
      position: relative;
    }

    /* 歡迎預設頁面 */
    .welcome-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      gap: 1.5rem;
    }

    .welcome-icon {
      font-size: 4rem;
      background: linear-gradient(135deg, var(--accent), #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .welcome-title {
      font-family: var(--font-title);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* 渲染的 Markdown 排版樣式 */
    .recipe-detail {
      max-width: 800px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    .detail-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
      line-height: 1.25;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .meta-link {
      color: var(--accent);
      text-decoration: none;
      transition: text-decoration 0.2s;
    }

    .meta-link:hover {
      text-decoration: underline;
    }

    /* Markdown 樣式細緻調整 */
    .recipe-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #e5e7eb;
    }

    .recipe-body h1, .recipe-body h2, .recipe-body h3 {
      font-family: var(--font-title);
      color: #ffffff;
      margin-top: 1.75rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .recipe-body h1 { font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .recipe-body h2 { font-size: 1.45rem; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
    .recipe-body h2::before { content: '❖'; font-size: 1rem; color: var(--accent); }
    .recipe-body h3 { font-size: 1.2rem; }

    .recipe-body p {
      margin-bottom: 1.25rem;
    }

    .recipe-body ul, .recipe-body ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
    }

    .recipe-body li {
      margin-bottom: 0.5rem;
    }

    .recipe-body blockquote {
      border-left: 4px solid var(--accent);
      background: rgba(245, 158, 11, 0.05);
      padding: 0.75rem 1.25rem;
      margin-bottom: 1.5rem;
      border-radius: 0 8px 8px 0;
      color: #d1d5db;
    }

    .recipe-body strong {
      color: #ffffff;
      font-weight: 600;
    }

    .recipe-body hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 2rem 0;
    }

    /* 頂部操作按鈕 */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--text-secondary);
    }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0f19;
      font-weight: 600;
    }

    .btn-accent:hover {
      background: #d97706;
      border-color: #d97706;
      color: #0b0f19;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* 捲軸美化 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <header>
    <div class="logo-container">
      <div class="logo-icon">🍳</div>
      <div>
        <h1>美味食譜知識庫</h1>
      </div>
    </div>
    <div class="db-stats" id="db-info">
      <!-- JS 動態生成統計資料 -->
    </div>
  </header>

  <!-- 主要框架 -->
  <div class="main-container">
    
    <!-- 左側欄：Wiki 知識分類樹 -->
    <div class="sidebar">
      <div class="sidebar-title">📁 知識分類樹</div>
      
      <!-- 食材分類 -->
      <div class="category-group" id="group-ingredients">
        <div class="category-header" onclick="toggleGroup('group-ingredients')">🥩 食材分類</div>
        <ul class="category-list" id="list-ingredients"></ul>
      </div>

      <!-- 烹飪方式 -->
      <div class="category-group" id="group-methods">
        <div class="category-header" onclick="toggleGroup('group-methods')">🔥 烹飪方式</div>
        <ul class="category-list" id="list-methods"></ul>
      </div>

      <!-- 場景分類 -->
      <div class="category-group" id="group-scenes">
        <div class="category-header" onclick="toggleGroup('group-scenes')">🍱 場景分類</div>
        <ul class="category-list" id="list-scenes"></ul>
      </div>
      
      <!-- 其他分類 -->
      <div class="category-group" id="group-others">
        <div class="category-header" onclick="toggleGroup('group-others')">🏷️ 其他標籤</div>
        <ul class="category-list" id="list-others"></ul>
      </div>
    </div>

    <!-- 中間欄：食譜列表與搜尋 -->
    <div class="list-panel">
      <div class="search-container">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-box" placeholder="自然語言模糊搜尋食譜..." oninput="onSearch()">
        </div>
        <div class="search-hint">
          💡 支援多關鍵字搜尋，例如：「起司 烘蛋」或「雞腿排 便當」
        </div>
      </div>
      <div class="recipe-list" id="recipes-container">
        <!-- 食譜卡片動態渲染 -->
      </div>
    </div>

    <!-- 右側欄：食譜內容展示 -->
    <div class="detail-panel" id="detail-panel">
      <div class="welcome-container">
        <div class="welcome-icon">📖</div>
        <div class="welcome-title">歡迎來到個人食譜 Wiki</div>
        <p style="max-width: 400px; line-height: 1.6;">請點擊左側分類標籤或輸入關鍵字搜尋，展開精彩的台式/異國美味食譜！</p>
      </div>
    </div>

  </div>

  <script>
    // 定義標籤分群規則
    const groupRules = {
      ingredients: ["豬肉料理", "雞肉料理", "牛肉料理", "魚肉料理", "海鮮料理", "蛋料理", "馬鈴薯", "豆腐", "香腸", "米血", "魷魚", "滷蛋"],
      methods: ["氣炸鍋料理", "電鍋料理", "平底鍋", "烤箱", "滷味", "香煎", "清蒸", "烘蛋"],
      scenes: ["家常菜", "便當菜", "早餐", "宵夜", "下酒菜", "甜點", "熱炒"]
    };

    let recipeDb = [];
    let searchIndex = null;
    let activeTag = null;
    let activeRecipeId = null;

    // 初始化載入
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.RECIPE_DB) {
        console.error("找不到 RECIPE_DB 資料！請確認已成功執行 update_index.py 產生 database.js。");
        document.getElementById("detail-panel").innerHTML = `
          <div class="welcome-container">
            <div class="welcome-icon" style="color: #ef4444;">⚠️</div>
            <div class="welcome-title">資料載入失敗</div>
            <p>找不到 <code>database.js</code> 資料檔，請在本機終端機執行 <code>python update_index.py</code> 生成索引資料庫後再重新整理網頁！</p>
          </div>
        `;
        return;
      }

      // 將原本 JSON 字典轉換為 Array 方便操作，並將檔案相對路徑作為 ID
      recipeDb = Object.entries(window.RECIPE_DB.recipes).map(([path, data]) => ({
        id: path,
        ...data
      }));

      // 初始化 MiniSearch 全文檢索 (加入斷網離線容錯 try-catch)
      try {
        if (typeof MiniSearch !== 'undefined') {
          searchIndex = new MiniSearch({
            fields: ['title', 'tags', 'author', 'content'], // 檢索的欄位
            storeFields: ['id'], // 檢索成功時回傳的欄位
            searchOptions: {
              boost: { title: 3, tags: 2, content: 1 }, // 欄位加權比重
              prefix: true, // 支援首碼匹配
              fuzzy: 0.2    // 容許少許拼寫錯誤 (模糊檢索)
            }
          });
          searchIndex.addAll(recipeDb);
        } else {
          console.warn("無法載入 MiniSearch 模組 (可能為離線狀態)，將使用備用本地搜尋引擎");
        }
      } catch (e) {
        console.warn("初始化 MiniSearch 失敗，切換為備用搜尋: ", e);
        searchIndex = null;
      }

      // 渲染頂部狀態資訊
      renderHeaderStats();

      // 解析並渲染左側分類樹
      renderCategoryTree();

      // 預設渲染完整列表
      renderRecipeList(recipeDb);
    });

    // 渲染頂部資訊
    function renderHeaderStats() {
      const infoContainer = document.getElementById("db-info");
      const recipeCount = recipeDb.length;
      const lastUpdated = window.RECIPE_DB.last_updated || "未知";
      infoContainer.innerHTML = `
        <span>最後更新時間：${lastUpdated}</span>
        <span class="badge">共收錄 ${recipeCount} 道食譜</span>
      `;
    }

    // 展開/收合分類群組
    function toggleGroup(groupId) {
      const groupEl = document.getElementById(groupId);
      groupEl.classList.toggle("collapsed");
    }

    // 解析標籤並渲染 Wiki 分類樹
    function renderCategoryTree() {
      const tagCounts = {};
      recipeDb.forEach(recipe => {
        (recipe.tags || []).forEach(tag => {
          tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        });
      });

      const categories = {
        ingredients: [],
        methods: [],
        scenes: [],
        others: []
      };

      // 依照分類規則歸檔 tags
      Object.entries(tagCounts).forEach(([tag, count]) => {
        const item = { name: tag, count: count };
        if (groupRules.ingredients.includes(tag)) {
          categories.ingredients.push(item);
        } else if (groupRules.methods.includes(tag)) {
          categories.methods.push(item);
        } else if (groupRules.scenes.includes(tag)) {
          categories.scenes.push(item);
        } else {
          categories.others.push(item);
        }
      });

      // 排序（依食譜數量由多到少排序）
      const sortByCount = (a, b) => b.count - a.count;
      Object.keys(categories).forEach(k => categories[k].sort(sortByCount));

      // 渲染至 HTML
      renderListHelper("list-ingredients", categories.ingredients);
      renderListHelper("list-methods", categories.methods);
      renderListHelper("list-scenes", categories.scenes);
      renderListHelper("list-others", categories.others);

      // 計算以動畫展開的高度
      ["list-ingredients", "list-methods", "list-scenes", "list-others"].forEach(id => {
        const el = document.getElementById(id);
        el.style.maxHeight = el.scrollHeight + "px";
      });
    }

    function renderListHelper(ulId, items) {
      const ul = document.getElementById(ulId);
      ul.innerHTML = items.map(item => `
        <li class="category-item" id="tag-${item.name}" onclick="selectTag('${item.name}')">
          <span># ${item.name}</span>
          <span class="item-count">${item.count}</span>
        </li>
      `).join('');
    }

    // 選擇特定標籤進行過濾
    function selectTag(tagName) {
      const clickedTagEl = document.getElementById(`tag-${tagName}`);
      
      // 清空搜尋框
      document.getElementById("search-box").value = "";

      if (activeTag === tagName) {
        // 取消選取
        activeTag = null;
        clickedTagEl.classList.remove("active");
        renderRecipeList(recipeDb);
      } else {
        // 變更選取
        if (activeTag) {
          const prevActive = document.getElementById(`tag-${activeTag}`);
          if (prevActive) prevActive.classList.remove("active");
        }
        activeTag = tagName;
        clickedTagEl.classList.add("active");

        const filtered = recipeDb.filter(recipe => (recipe.tags || []).includes(tagName));
        renderRecipeList(filtered);
      }
    }

    // 渲染中間食譜列表
    function renderRecipeList(recipes) {
      const container = document.getElementById("recipes-container");
      if (recipes.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.9rem;">
            🔍 找不到符合條件的食譜
          </div>
        `;
        return;
      }

      container.innerHTML = recipes.map(recipe => {
        const isActive = recipe.id === activeRecipeId ? 'active' : '';
        const tagsHtml = (recipe.tags || []).map(t => `<span class="tag-pill">#${t}</span>`).join('');
        return `
          <div class="recipe-card ${isActive}" id="card-${recipe.id.replace(/[^a-zA-Z0-9]/g, '_')}" onclick="viewRecipe('${recipe.id}')">
            <div class="card-title">${recipe.title}</div>
            <div class="card-meta">
              <span>👤 <span class="card-author">${recipe.author}</span></span>
            </div>
            <div class="card-summary">${recipe.summary}</div>
            <div class="card-tags">${tagsHtml}</div>
          </div>
        `;
      }).join('');
    }

    // 當搜尋框輸入時 (自然語言與模糊全文檢索)
    function onSearch() {
      const query = document.getElementById("search-box").value.trim().toLowerCase();
      
      // 取消左側標籤的高亮狀態
      if (activeTag) {
        const activeTagEl = document.getElementById(`tag-${activeTag}`);
        if (activeTagEl) activeTagEl.classList.remove("active");
        activeTag = null;
      }

      if (!query) {
        renderRecipeList(recipeDb);
        return;
      }

      let searchedRecipes = [];
      if (searchIndex) {
        try {
          const results = searchIndex.search(query);
          searchedRecipes = results.map(result => {
            return recipeDb.find(r => r.id === result.id);
          }).filter(Boolean);
        } catch (e) {
          console.error("MiniSearch 檢索發生錯誤，切換為本地引擎:", e);
          searchIndex = null;
        }
      }

      // 斷網離線備用搜尋引擎 (簡單好用的多欄位 String.includes 過濾)
      if (!searchIndex) {
        searchedRecipes = recipeDb.filter(recipe => {
          const titleMatch = (recipe.title || "").toLowerCase().includes(query);
          const authorMatch = (recipe.author || "").toLowerCase().includes(query);
          const tagsMatch = (recipe.tags || []).some(t => t.toLowerCase().includes(query));
          const contentMatch = (recipe.content || "").toLowerCase().includes(query);
          return titleMatch || authorMatch || tagsMatch || contentMatch;
        });
      }

      renderRecipeList(searchedRecipes);
    }

    // 閱讀特定食譜
    function viewRecipe(recipeId) {
      // 變更 Active 卡片樣式
      if (activeRecipeId) {
        const prevCard = document.getElementById(`card-${activeRecipeId.replace(/[^a-zA-Z0-9]/g, '_')}`);
        if (prevCard) prevCard.classList.remove("active");
      }
      activeRecipeId = recipeId;
      const currentCard = document.getElementById(`card-${recipeId.replace(/[^a-zA-Z0-9]/g, '_')}`);
      if (currentCard) currentCard.classList.add("active");

      const recipe = recipeDb.find(r => r.id === recipeId);
      if (!recipe) return;

      const detailPanel = document.getElementById("detail-panel");
      
      // 解析 Markdown 內容 (加入 marked 存在性防護)
      let parsedBody = recipe.content;
      if (typeof marked !== 'undefined' && marked.parse) {
        try {
          marked.setOptions({
            breaks: true,
            gfm: true
          });
          parsedBody = marked.parse(recipe.content);
        } catch (e) {
          console.error("marked 解析錯誤: ", e);
        }
      } else {
        // 本地備用 Markdown 渲染 (簡易文字與 HTML 轉換)
        parsedBody = recipe.content
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/\n/g, "<br>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/#\s+(.+)/g, "<h1>$1</h1>")
          .replace(/##\s+(.+)/g, "<h2>$1</h2>");
      }

      detailPanel.innerHTML = `
        <div class="recipe-detail">
          <div class="action-bar">
            <button class="btn" onclick="copyMarkdown(\`${recipeId}\`)">📋 複製食譜內容</button>
            ${recipe.source ? `<a href="${recipe.source}" target="_blank" class="btn btn-accent" style="text-decoration:none;">🔗 點此觀看原影片/來源</a>` : ''}
          </div>
          <div class="detail-header">
            <h2 class="detail-title">${recipe.title}</h2>
            <div class="detail-meta">
              <div class="meta-item">👤 作者：<strong>${recipe.author}</strong></div>
              ${recipe.source ? `<div class="meta-item">🎥 來源：<a href="${recipe.source}" target="_blank" class="meta-link">${recipe.author} 的 IG Reels</a></div>` : ''}
              <div class="meta-item">📂 路徑：<code>${recipeId}</code></div>
            </div>
          </div>
          <div class="recipe-body">
            ${parsedBody}
          </div>
        </div>
      `;
      detailPanel.scrollTop = 0;
    }

    // 複製食譜 Markdown 全文
    function copyMarkdown(recipeId) {
      const recipe = recipeDb.find(r => r.id === recipeId);
      if (!recipe) return;
      
      // 組合 Frontmatter 與內文
      const fullMarkdown = `---
title: "${recipe.title}"
tags:
${(recipe.tags || []).map(t => `  - "${t}"`).join('\n')}
author: "${recipe.author}"
source: "${recipe.source}"
---

${recipe.content}`;

      navigator.clipboard.writeText(fullMarkdown).then(() => {
        alert("🎉 食譜 Markdown 全文已複製到剪貼簿！");
      }).catch(err => {
        console.error("複製失敗: ", err);
      });
    }
  </script>
</body>
</html>
